<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 選股報告 — 2026-03-26</title>

    <style>
        :root {
            --bg: #0f1117; --card: #1a1d27; --border: #2a2d3e;
            --text: #e2e8f0; --sub: #94a3b8;
            --pos: #22c55e; --neg: #ef4444; --neutral: #94a3b8;
            --accent: #6366f1; --accent2: #8b5cf6;
            --bull: #22c55e; --bear: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, 'PingFang TC', 'Microsoft JhengHei',
                         sans-serif;
            font-size: 14px; line-height: 1.6;
        }
        a { color: var(--accent); text-decoration: none; }

        /* ── 頂部 Header ── */
        .header {
            background: linear-gradient(135deg, #1a1d27 0%, #12141f 100%);
            border-bottom: 1px solid var(--border);
            padding: 24px 32px;
        }
        .header-top { display:flex; justify-content:space-between;
                      align-items:center; flex-wrap:wrap; gap:12px; }
        .header h1 { font-size:22px; font-weight:700;
                     background: linear-gradient(90deg,#6366f1,#8b5cf6);
                     -webkit-background-clip:text;
                     -webkit-text-fill-color:transparent; }
        .header-meta { color:var(--sub); font-size:13px; margin-top:6px; }
        .header-stats { display:flex; gap:24px; flex-wrap:wrap; }
        .hstat { text-align:center; }
        .hstat-num { font-size:20px; font-weight:700; }
        .hstat-label { font-size:11px; color:var(--sub); margin-top:2px; }

        /* ── 主容器 ── */
        .container { max-width:1400px; margin:0 auto; padding:24px 32px; }

        /* ── Section ── */
        .section { margin-bottom:40px; }
        .section-title {
            font-size:16px; font-weight:600; margin-bottom:16px;
            padding-bottom:10px; border-bottom:1px solid var(--border);
            display:flex; align-items:center; gap:8px;
        }
        .sub-title {
            font-size:14px; font-weight:600; margin:20px 0 10px;
            color:var(--sub);
        }

        /* ── 今日訊號：Card Grid ── */
        .signal-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap:16px;
        }
        .signal-card {
            background:var(--card); border:1px solid var(--border);
            border-radius:12px; overflow:hidden;
            transition: transform .15s, box-shadow .15s;
        }
        .signal-card:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(99,102,241,.2);
        }
        .card-header {
            display:flex; justify-content:space-between; align-items:flex-start;
            padding:14px 16px 10px; background:rgba(99,102,241,.08);
            border-bottom:1px solid var(--border);
        }
        .card-ticker { font-weight:700; font-size:15px; line-height:1.3; }
        .card-ticker small { font-weight:400; font-size:11px; color:var(--sub); }
        .card-score {
            font-size:18px; font-weight:800;
            border-radius:8px; padding:2px 8px;
        }
        .score-high { color:#22c55e; background:rgba(34,197,94,.1); }
        .score-mid  { color:#f59e0b; background:rgba(245,158,11,.1); }
        .score-low  { color:#94a3b8; background:rgba(148,163,184,.1); }
        .card-body  { padding:12px 16px; }
        .card-row   {
            display:flex; justify-content:space-between;
            align-items:center; padding:4px 0;
            border-bottom:1px solid rgba(42,45,62,.6);
        }
        .card-row:last-child { border-bottom:none; }
        .card-row .label { color:var(--sub); font-size:12px; }
        .card-row .value { font-weight:500; font-size:13px; text-align:right; }
        .card-signals { margin-top:10px; display:flex; flex-wrap:wrap; gap:4px; }

        /* ── 徽章 ── */
        .badge {
            font-size:11px; font-weight:600; padding:2px 7px;
            border-radius:4px; letter-spacing:.5px;
        }
        .badge-on  { background:rgba(34,197,94,.15); color:#22c55e;
                     border:1px solid rgba(34,197,94,.3); }
        .badge-off { background:rgba(148,163,184,.08); color:#64748b;
                     border:1px solid rgba(100,116,139,.2); }

        /* ── Regime Badge ── */
        .regime { font-size:11px; font-weight:600;
                  padding:2px 8px; border-radius:10px; }
        .regime.bull { background:rgba(34,197,94,.15); color:#22c55e; }
        .regime.bear { background:rgba(239,68,68,.15); color:#ef4444; }
        .regime.neutral { background:rgba(148,163,184,.12); color:#94a3b8; }

        /* ── 顏色工具 ── */
        .pos     { color:var(--pos); }
        .neg     { color:var(--neg); }
        .neutral { color:var(--neutral); }

        /* ── 表格 ── */
        .table-wrap { overflow-x:auto; border-radius:10px;
                      border:1px solid var(--border); }
        .data-table { width:100%; border-collapse:collapse; }
        .data-table th {
            background:#12141f; padding:10px 14px;
            text-align:left; font-size:12px; color:var(--sub);
            white-space:nowrap; cursor:pointer; user-select:none;
        }
        .data-table th:hover { color:var(--text); }
        .data-table td {
            padding:10px 14px; border-top:1px solid var(--border);
            vertical-align:middle;
        }
        .data-table tr:hover td { background:rgba(99,102,241,.05); }
        .data-table.compact td,
        .data-table.compact th { padding:7px 12px; font-size:13px; }
        .ticker-cell { font-weight:600; }
        .ticker-cell small { font-weight:400; color:var(--sub);
                             font-size:11px; display:block; }
        .pnl-cell { font-weight:700; font-size:15px; }
        .exit-tag {
            font-size:11px; padding:2px 8px; border-radius:8px;
            background:rgba(99,102,241,.12); color:#a5b4fc;
        }

        /* ── 進度條 ── */
        .progress-wrap {
            height:6px; background:rgba(42,45,62,.8);
            border-radius:3px; overflow:hidden; margin-bottom:4px;
        }
        .progress-bar { height:100%; border-radius:3px; min-width:4px; }
        .bar-pos { background:linear-gradient(90deg,#6366f1,#22c55e); }
        .bar-neg { background:linear-gradient(90deg,#ef4444,#f59e0b); }
        .progress-labels { display:flex; justify-content:space-between;
                           font-size:10px; }

        /* ── 統計 Card ── */
        .stats-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
            gap:12px; margin-bottom:24px;
        }
        .stat-card {
            background:var(--card); border:1px solid var(--border);
            border-radius:10px; padding:16px; text-align:center;
        }
        .stat-num  { font-size:22px; font-weight:700; line-height:1.2; }
        .stat-label{ font-size:11px; color:var(--sub); margin-top:4px; }

        /* ── Tab ── */
        .tabs { display:flex; gap:4px; margin-bottom:16px; }
        .tab-btn {
            padding:8px 20px; border-radius:8px; cursor:pointer;
            font-size:13px; font-weight:500; border:1px solid var(--border);
            background:transparent; color:var(--sub); transition:.15s;
        }
        .tab-btn.active {
            background:var(--accent); border-color:var(--accent);
            color:#fff;
        }
        .tab-pane { display:none; }
        .tab-pane.active { display:block; }

        /* ── 空狀態 ── */
        .empty-state {
            text-align:center; padding:48px; color:var(--sub);
        }
        .empty-icon { font-size:48px; margin-bottom:12px; }

        /* ── 滾動回頂 ── */
        .back-top {
            position:fixed; bottom:24px; right:24px;
            background:var(--accent); color:#fff;
            border:none; border-radius:50%; width:40px; height:40px;
            font-size:18px; cursor:pointer; opacity:.8;
            display:flex; align-items:center; justify-content:center;
        }
        .back-top:hover { opacity:1; }

        @media(max-width:768px) {
            .container { padding:16px; }
            .header { padding:16px; }
            .signal-grid { grid-template-columns:1fr 1fr; }
            .stats-grid  { grid-template-columns:repeat(3,1fr); }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div>
            <h1>🤖 AI 選股每日報告</h1>
            <div class="header-meta">
                基準日期：2026-03-26 ｜ 更新時間：2026-03-26 15:52:16 HKT ｜
                模型門檻：0.467
            </div>
        </div>
        <div class="header-stats">
            <div class="hstat">
                <div class="hstat-num"><span class="regime neutral">中性</span></div>
                <div class="hstat-label">市場環境</div>
            </div>
            <div class="hstat">
                <div class="hstat-num">0</div>
                <div class="hstat-label">今日訊號</div>
            </div>
            <div class="hstat">
                <div class="hstat-num">0</div>
                <div class="hstat-label">當前持倉</div>
            </div>
            <div class="hstat">
                <div class="hstat-num neutral">
                    +0.0%
                </div>
                <div class="hstat-label">回測累計</div>
            </div>
            <div class="hstat">
                <div class="hstat-num">0</div>
            <div class="hstat-label">今日出場</div>
        </div>
        </div>
    </div>
</div>

<div class="container">

    <!-- Section 1: 今日買入訊號 -->
    <div class="section">
        <div class="section-title">
            📡 今日買入訊號
            <small style="color:var(--sub);font-weight:400;font-size:13px">
                (0 支)
            </small>
        </div>
            
        <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p>今日無符合條件的買入訊號</p>
        </div>
        </div>

        <!-- Section 1b: 今日賣出訊號 -->
        <div class="section">
            <div class="section-title">
                🔔 今日賣出訊號
                <small style="color:var(--sub);font-weight:400;font-size:13px">
                    (0 筆)
                </small>
            </div>
            
        <div class="empty-state">
            <div class="empty-icon">✅</div>
            <p>今日無出場記錄</p>
        </div>
        </div>

        <!-- Section 2 -->
    <div class="section">
        <div class="section-title">
            📊 當前持倉
            <small style="color:var(--sub);font-weight:400;font-size:13px">
                (0 筆)
            </small>
        </div>
        
        <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>目前無持倉</p>
        </div>
    </div>

    <!-- Section 3: 歷史交易 -->
    <div class="section">
        <div class="section-title">📋 歷史交易統計</div>

        <div class="tabs">
            <button class="tab-btn active"
                    data-tab-group="history"
                    onclick="showTab('history','tab-overall')">
                🌐 全部統計
            </button>
            <button class="tab-btn"
                    data-tab-group="history"
                    onclick="showTab('history','tab-ticker')">
                📌 個股統計
            </button>
        </div>

        <div id="tab-overall" class="tab-pane active" data-group="history">
            <p class="neutral">暫無歷史交易數據</p>
        </div>
        <div id="tab-ticker" class="tab-pane" data-group="history">
            <p class="neutral">暫無數據</p>
        </div>
    </div>

</div><!-- /container -->

<button class="back-top" title="返回頂部">↑</button>

    <script>
    function showTab(group, id) {
        document.querySelectorAll('[data-group="'+group+'"]').forEach(p => {
            p.classList.remove('active');
        });
        document.querySelectorAll('[data-tab-group="'+group+'"]').forEach(b => {
            b.classList.remove('active');
        });
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    function sortTable(colIdx) {
        const tbl  = document.getElementById('ticker-stats-table');
        const tbody= tbl.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        const asc  = tbl.dataset.sortCol == colIdx &&
                     tbl.dataset.sortDir == 'asc';
        rows.sort((a, b) => {
            const av = a.cells[colIdx].innerText.replace(/[+$,%]/g,'').trim();
            const bv = b.cells[colIdx].innerText.replace(/[+$,%]/g,'').trim();
            const an = parseFloat(av), bn = parseFloat(bv);
            if (!isNaN(an) && !isNaN(bn)) return asc ? an-bn : bn-an;
            return asc ? av.localeCompare(bv) : bv.localeCompare(av);
        });
        rows.forEach(r => tbody.appendChild(r));
        tbl.dataset.sortCol = colIdx;
        tbl.dataset.sortDir = asc ? 'desc' : 'asc';
    }

    document.querySelector('.back-top').addEventListener('click', () => {
        window.scrollTo({top:0, behavior:'smooth'});
    });
    </script>
</body>
</html>
